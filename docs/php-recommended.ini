; Recommended PHP settings for StayExplore Kenya (v9.33).
; OPcache keeps compiled PHP in memory so each page does not re-parse ~100 files. It can only be set in php.ini (not per site).
; XAMPP: edit C:\xampp\php\php.ini, find the [opcache] section, uncomment/set these lines, then restart Apache.
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=2        ; development. On a live server use 60, or set validate_timestamps=0 and restart PHP after each deploy
opcache.save_comments=1          ; keep (PHPMailer and some libraries read doc comments)

; Uploads: the app accepts photos up to 5 MB and compresses them on upload.
upload_max_filesize=8M
post_max_size=24M
max_file_uploads=20

; Needed by the image optimiser and thumbnails: extension=gd (and exif for phone-photo rotation)
